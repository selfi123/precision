<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultra-Premium 3D Showcase</title>
  <style>
    body {
      margin: 0; padding: 0; overflow: hidden;
      background-color: #050d1a; /* Dark background to make bloom pop */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #canvas-container {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1;
    }
    #ui-container {
      position: absolute; top: 30px; left: 50%; transform: translateX(-50%); z-index: 10;
      background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px);
      padding: 10px 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
      display: flex; gap: 10px;
    }
    button {
      background: transparent; border: none; padding: 10px 20px; border-radius: 12px;
      cursor: pointer; font-size: 14px; font-weight: 600; color: #94a3b8;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    button:hover { color: #fff; background: rgba(255,255,255,0.05); }
    button.active {
      background: linear-gradient(135deg, #00E5FF, #D62BC7); color: white;
      box-shadow: 0 4px 20px rgba(0, 229, 255, 0.3);
    }
    #description {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 10;
      background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px);
      padding: 20px 30px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
      text-align: center; color: #f8fafc; max-width: 600px; pointer-events: none;
    }
    #description h3 { margin: 0 0 10px 0; font-size: 22px; background: linear-gradient(90deg, #00E5FF, #D62BC7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #description p { margin: 0; font-size: 15px; line-height: 1.6; color: #cbd5e1; }
  </style>

  <!-- Three.js Core -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Post Processing -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/Pass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <!-- Controls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Simplex Noise for advanced procedural generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
</head>
<body>

  <div id="ui-container">
    <button class="active" onclick="switchConcept(0)">1. The Quantum Cell</button>
    <button onclick="switchConcept(1)">2. Energy Waves</button>
    <button onclick="switchConcept(2)">3. Orbital Vortex</button>
  </div>

  <div id="description">
    <h3 id="desc-title">The Quantum Cell (Custom GLSL)</h3>
    <p id="desc-text">An advanced, organically morphing sphere using complex vertex displacement shaders. Symbolizes the synthesis of biology and cutting-edge digital technology.</p>
  </div>

  <div id="canvas-container"></div>

  <script>
    const descriptions = [
      { title: "The Quantum Cell (GLSL Shader)", text: "An advanced, organically morphing structure driven by custom GLSL shaders. It visualizes the blending of biological complexity (cells) and high-tech algorithms. Perfect for a modern biotech startup." },
      { title: "Energy Waves (Dynamic Wireframe)", text: "A solid, glowing cyan core encased in a massive, wavy energy field. The outer shell uses complex vertex displacement shaders to move like turbulent ocean waves around the data core." },
      { title: "Orbital Vortex (Particle Simulation)", text: "A solid magenta data core surrounded by a massive, wavy accretion disk of 15,000 glowing particles. The particles flow in mathematical sine waves, representing an immense flow of genomic data." }
    ];

    let scene, camera, renderer, composer, clock, controls;
    let currentGroup, activeIndex = 0;
    
    // Globals for specific concepts
    let quantumMaterial; 
    let swarmInstancedMesh, dummy, simplex;
    let swarmPositions, swarmVelocities, swarmPhases;
    let matrixEdges = [], matrixPulses = [];

    init();
    animate();

    function init() {
      const container = document.getElementById('canvas-container');
      clock = new THREE.Clock();
      simplex = new SimplexNoise();
      dummy = new THREE.Object3D();

      // Scene setup
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x050d1a, 0.015);

      // Camera
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 20);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      container.appendChild(renderer.domElement);

      // Orbit Controls for interaction
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enablePan = false;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 1.0;

      // Post-Processing (Unreal Bloom)
      const renderScene = new THREE.RenderPass(scene, camera);
      const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
      bloomPass.threshold = 0.1;
      bloomPass.strength = 1.2;
      bloomPass.radius = 0.5;

      composer = new THREE.EffectComposer(renderer);
      composer.addPass(renderScene);
      composer.addPass(bloomPass);

      // Initial Concept
      switchConcept(0);
      window.addEventListener('resize', onWindowResize);
    }

    // =========================================================
    // CONCEPT 1: THE QUANTUM CELL (CUSTOM SHADER)
    // =========================================================
    function buildQuantumCell() {
      const group = new THREE.Group();
      
      const vertexShader = `
        uniform float time;
        varying vec3 vNormal;
        varying vec3 vPosition;
        
        // Simplex noise function
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
        float snoise(vec3 v) {
          const vec2 C = vec2(1.0/6.0, 1.0/3.0);
          const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
          vec3 i  = floor(v + dot(v, C.yyy));
          vec3 x0 = v - i + dot(i, C.xxx);
          vec3 g = step(x0.yzx, x0.xyz);
          vec3 l = 1.0 - g;
          vec3 i1 = min(g.xyz, l.zxy);
          vec3 i2 = max(g.xyz, l.zxy);
          vec3 x1 = x0 - i1 + C.xxx;
          vec3 x2 = x0 - i2 + C.yyy;
          vec3 x3 = x0 - D.yyy;
          i = mod289(i);
          vec4 p = permute(permute(permute(
                    i.z + vec4(0.0, i1.z, i2.z, 1.0))
                  + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                  + i.x + vec4(0.0, i1.x, i2.x, 1.0));
          float n_ = 0.142857142857;
          vec3 ns = n_ * D.wyz - D.xzx;
          vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
          vec4 x_ = floor(j * ns.z);
          vec4 y_ = floor(j - 7.0 * x_);
          vec4 x = x_ *ns.x + ns.yyyy;
          vec4 y = y_ *ns.x + ns.yyyy;
          vec4 h = 1.0 - abs(x) - abs(y);
          vec4 b0 = vec4(x.xy, y.xy);
          vec4 b1 = vec4(x.zw, y.zw);
          vec4 s0 = floor(b0)*2.0 + 1.0;
          vec4 s1 = floor(b1)*2.0 + 1.0;
          vec4 sh = -step(h, vec4(0.0));
          vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
          vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
          vec3 p0 = vec3(a0.xy, h.x);
          vec3 p1 = vec3(a0.zw, h.y);
          vec3 p2 = vec3(a1.xy, h.z);
          vec3 p3 = vec3(a1.zw, h.w);
          vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
          p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
          vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
          m = m * m; return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
        }

        void main() {
          vNormal = normal;
          // Calculate noise displacement
          float noise = snoise(vec3(position.x * 0.5 + time * 0.2, position.y * 0.5 + time * 0.3, position.z * 0.5));
          float displacement = noise * 1.5;
          
          vec3 newPosition = position + normal * displacement;
          vPosition = newPosition;
          
          gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
        }
      `;

      const fragmentShader = `
        uniform float time;
        varying vec3 vNormal;
        varying vec3 vPosition;
        
        void main() {
          // Dynamic color based on position and normal
          float intensity = pow(0.65 - dot(vNormal, vec3(0, 0, 1.0)), 2.0);
          
          vec3 color1 = vec3(0.0, 0.9, 1.0); // Cyan
          vec3 color2 = vec3(0.84, 0.17, 0.78); // Magenta
          vec3 color3 = vec3(0.0, 0.2, 0.8); // Deep Blue
          
          float mix1 = sin(vPosition.y * 0.5 + time) * 0.5 + 0.5;
          float mix2 = cos(vPosition.x * 0.5 - time) * 0.5 + 0.5;
          
          vec3 finalColor = mix(color1, color2, mix1);
          finalColor = mix(finalColor, color3, mix2);
          
          // Add glow outline
          gl_FragColor = vec4(finalColor * (intensity * 1.5 + 0.5), 1.0);
        }
      `;

      quantumMaterial = new THREE.ShaderMaterial({
        uniforms: { time: { value: 0 } },
        vertexShader: vertexShader,
        fragmentShader: fragmentShader,
        wireframe: true,
        transparent: true
      });

      const geometry = new THREE.IcosahedronGeometry(5, 60); // High res
      const mesh = new THREE.Mesh(geometry, quantumMaterial);
      group.add(mesh);

      // Inner solid core
      const coreMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
      const core = new THREE.Mesh(new THREE.IcosahedronGeometry(4.5, 30), coreMat);
      group.add(core);

      // Orbiting particles
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(500 * 3);
      for(let i=0; i<500; i++) {
        const r = 7 + Math.random() * 5;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        pPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
        pPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
        pPos[i*3+2] = r * Math.cos(phi);
      }
      pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
      const pMat = new THREE.PointsMaterial({ color: 0x00E5FF, size: 0.1, transparent: true, opacity: 0.6 });
      const particles = new THREE.Points(pGeo, pMat);
      group.add(particles);

      group.userData.update = function(time) {
        quantumMaterial.uniforms.time.value = time;
        particles.rotation.y = time * 0.1;
        particles.rotation.x = time * 0.05;
      };

      return group;
    }

    // =========================================================
    // =========================================================
    // =========================================================
    // CONCEPT 2: ENERGY WAVES
    // =========================================================
    function buildEnergyWaves() {
      const group = new THREE.Group();
      
      // 1. Inner solid sphere (The Core)
      const coreMat = new THREE.MeshBasicMaterial({ color: 0x00E5FF });
      const core = new THREE.Mesh(new THREE.IcosahedronGeometry(3, 30), coreMat);
      group.add(core);

      // 2. Outer Wavy Shell (The Waves)
      const vShader = `
        uniform float time;
        varying vec3 vPosition;
        void main() {
          vec3 p = position;
          // Massive wavy distortion on the outer shell
          float wave1 = sin(p.x * 0.5 + time) * cos(p.y * 0.5 + time) * 2.0;
          float wave2 = sin(p.z * 0.8 - time * 1.5) * 1.5;
          p += normal * (wave1 + wave2);
          vPosition = p;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
        }
      `;
      const fShader = `
        uniform float time;
        varying vec3 vPosition;
        void main() {
          // Dynamic color based on position (waves)
          float intensity = (vPosition.y + 10.0) / 20.0;
          vec3 color = mix(vec3(0.84, 0.17, 0.78), vec3(0.0, 0.9, 1.0), intensity);
          gl_FragColor = vec4(color, 0.8);
        }
      `;
      
      const outerMat = new THREE.ShaderMaterial({
        uniforms: { time: { value: 0 } },
        vertexShader: vShader,
        fragmentShader: fShader,
        wireframe: true,
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      
      const outerGeo = new THREE.IcosahedronGeometry(7, 40); // High res for smooth waves
      const outerWaves = new THREE.Mesh(outerGeo, outerMat);
      group.add(outerWaves);

      group.userData.update = function(time) {
        outerMat.uniforms.time.value = time;
        outerWaves.rotation.y = time * 0.2;
        outerWaves.rotation.x = time * 0.1;
        core.scale.setScalar(1.0 + Math.sin(time * 3) * 0.05); // Subtle core pulse
      };
      
      return group;
    }

    // =========================================================
    // CONCEPT 3: ORBITAL VORTEX
    // =========================================================
    function buildOrbitalVortex() {
      const group = new THREE.Group();
      
      // 1. Inner solid sphere (The Core)
      const coreMat = new THREE.MeshBasicMaterial({ color: 0xD62BC7 });
      const core = new THREE.Mesh(new THREE.IcosahedronGeometry(3, 30), coreMat);
      group.add(core);

      // 2. Massive Outer Vortex (Wavy Particles)
      const pCount = 15000;
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(pCount * 3);
      const pPhase = new Float32Array(pCount);
      
      for(let i = 0; i < pCount; i++) {
        // Generate particles in a wide disk/torus
        const radius = 4 + Math.random() * 8; // Spread from 4 to 12
        const theta = Math.random() * Math.PI * 2; // Angle around Y
        
        pPos[i*3] = Math.cos(theta) * radius;
        pPos[i*3+1] = (Math.random() - 0.5) * 2.0; 
        pPos[i*3+2] = Math.sin(theta) * radius;
        
        pPhase[i] = Math.random() * Math.PI * 2;
      }
      
      pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
      pGeo.setAttribute('phase', new THREE.BufferAttribute(pPhase, 1));
      
      const pVShader = `
        uniform float time;
        attribute float phase;
        varying float vDistance;
        void main() {
          vec3 p = position;
          float dist = length(p.xz);
          // Create massive sine waves based on distance from center and time
          p.y += sin(dist * 1.5 - time * 3.0 + phase * 0.1) * 3.0;
          p.y += cos(p.x * 0.5 + time) * 2.0;
          
          vDistance = dist;
          
          vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
          gl_PointSize = (15.0 / -mvPosition.z);
          gl_Position = projectionMatrix * mvPosition;
        }
      `;
      const pFShader = `
        varying float vDistance;
        void main() {
          vec2 xy = gl_PointCoord.xy - vec2(0.5);
          float ll = length(xy);
          if(ll > 0.5) discard;
          
          // Color based on distance from core
          float intensity = clamp((vDistance - 4.0) / 8.0, 0.0, 1.0);
          vec3 color = mix(vec3(1.0, 1.0, 1.0), vec3(0.0, 0.8, 1.0), intensity);
          
          gl_FragColor = vec4(color, 1.0 - (ll * 2.0));
        }
      `;
      
      const pMat = new THREE.ShaderMaterial({
        uniforms: { time: { value: 0 } },
        vertexShader: pVShader,
        fragmentShader: pFShader,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      
      const vortex = new THREE.Points(pGeo, pMat);
      group.add(vortex);

      group.userData.update = function(time) {
        pMat.uniforms.time.value = time;
        vortex.rotation.y = time * 0.15; // Slowly rotate the whole vortex
        core.rotation.x = time * 0.2;
        core.rotation.y = time * 0.2;
      };
      
      return group;
    }

    // Main animation loop
    function animate() {
      requestAnimationFrame(animate);
      
      const time = clock.getElapsedTime();
      
      if(currentGroup && currentGroup.userData.update) {
        currentGroup.userData.update(time);
      }

      controls.update(); // for auto-rotation and damping
      
      // Use composer instead of renderer for bloom effect
      composer.render();
    }

    // UI Logic
    function switchConcept(index) {
      if(currentGroup) {
        scene.remove(currentGroup);
      }
      
      // Clear old specific data if needed
      if(activeIndex === 1) { /* cleanup swarm if it was too heavy, but it's fine for demo */ }
      
      activeIndex = index;
      
      if(index === 0) currentGroup = buildQuantumCell();
      else if(index === 1) currentGroup = buildEnergyWaves();
      else if(index === 2) currentGroup = buildOrbitalVortex();
      
      scene.add(currentGroup);
      
      // Update UI
      const buttons = document.querySelectorAll('#ui-container button');
      buttons.forEach(b => b.classList.remove('active'));
      buttons[index].classList.add('active');
      document.getElementById('desc-title').innerText = descriptions[index].title;
      document.getElementById('desc-text').innerText = descriptions[index].text;

      // Reset camera
      camera.position.set(0, 0, 20);
      controls.target.set(0,0,0);
    };

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
